name = "u2d-stg-testing"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Callbacks live in a SQLite-backed Durable Object — available on the Workers
# free plan and created by the migration below, so a deploy needs no resource
# set up by hand first.
[[durable_objects.bindings]]
name = "HOOKS"
class_name = "HookStore"

[[durable_objects.bindings]]
name = "LINKS"
class_name = "LinkStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HookStore"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LinkStore"]

[assets]
directory = "./public"
binding = "ASSETS"
# Without this the asset layer answers before the Worker ever runs, and it
# replies 405 to a POST at "/" because index.html lives there — so a webhook
# pointed at the origin could never reach the sink. The Worker now sees every
# request and hands the ones it does not own back to ASSETS.
run_worker_first = true
