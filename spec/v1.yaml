openapi: "3.1.0"
info:
  title: "UpToData API (/v1)"
  version: "1.0.0"
  description: "UpToData's /v1 API is a usage-based B2B data API: real-time
    LinkedIn profile, company, post, and job enrichment, live people, company,
    job, and post search, Sales Navigator search, and asynchronous batch jobs,
    all through one `X-API-Key` header. Every call answers a `{data, meta}`
    envelope on success or an `{error}` envelope on failure. Enrich, activity,
    and batch item calls bill both when the target is found and when it comes
    back not found, private, deleted, or unreachable (`422
    unprocessable_target`); a call is only free when it fails with `400`, `401`,
    `402`, `429`, `500`, or `504`. Job search bills per job returned; people,
    company, and post search (Sales Navigator and standard alike) bill per page
    of up to 25 results, and empty pages are free. The base URL is
    `https://api.uptodata.io/v1`. Sync endpoints answer directly, typically in 2
    to 8 seconds; submit `POST /batch` for volume and read results by webhook
    (`batch.completed`) or by polling `GET /batch/{job_id}`."
  license:
    name: "Proprietary"
    identifier: "UNLICENSED"
servers:
  - url: "https://api.uptodata.io/v1"
security:
  - ApiKeyAuth: []
tags:
  - name: "Profiles"
    description: "Profiles operations."
  - name: "Companies"
    description: "Companies operations."
  - name: "Jobs"
    description: "Jobs operations."
  - name: "Posts"
    description: "Posts operations."
  - name: "Search"
    description: "Search operations."
  - name: "Batch"
    description: "Batch operations."
  - name: "Account"
    description: "Account operations."
