  /batch/{job_id}/results:
    get:
      operationId: "batch-results"
      summary: "Get incremental batch result entries"
      description: "Read a batch job's result entries as an incremental, cursor-paged feed."
      tags:
        - "Batch"
      parameters:
        - name: "job_id"
          in: "path"
          required: true
          schema:
            type: "string"
          description: "Path parameter. The job_id returned by POST /batch."
          example: "job_7hd92kfa"
        - name: "cursor"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Query parameter. Opaque delivery_seq cursor from a prior response.
            Omit for the first page."
          example: "eyJkZWxpdmVyeV9zZXEiOjJ9"
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
          description: "Query parameter. 1 to 1,000, default 100."
          example: 100
      responses:
        "200":
          description: "200 response"
          content:
            application/json:
              example:
                data:
                  job_id: "job_7hd92kfa"
                  status: "processing"
                  results_available: 3
                  entries:
                    - delivery_seq: 3
                      item_index: 2
                      entry_key: "https://linkedin.com/in/c"
                      data:
                        full_name: "Sam Example"
                        headline: "VP Sales at Example Corp"
                        url: "https://linkedin.com/in/c"
                      final_rank: 2
                  next_cursor: "eyJkZWxpdmVyeV9zZXEiOjN9"
                  has_more: true
                  recommended_poll_ms: 2000
                meta:
                  creditsUsed: 0
                  creditsRemaining: 421032
                  billed: false
                  reason: "poll"
                  requestId: "req_example"
              schema:
                type: "object"
                properties:
                  data:
                    $ref: "#/components/schemas/BatchResultPage"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "400":
          description: "A malformed cursor, or limit out of the 1 to 1,000 range."
          content:
            application/json:
              example:
                error:
                  type: "invalid_request"
                  message: "A malformed cursor, or limit out of the 1 to 1,000 range."
        "401":
          description: "Missing, malformed, or revoked key."
          content:
            application/json:
              example:
                error:
                  type: "invalid_api_key"
                  message: "Missing, malformed, or revoked key."
        "404":
          description: "No job with this job_id."
          content:
            application/json:
              example:
                error:
                  type: "not_found"
                  message: "No job with this job_id."
        "429":
          description: "Over the 300 requests/min limit. Honor Retry-After."
          content:
            application/json:
              example:
                error:
                  type: "rate_limited"
                  message: "Over the 300 requests/min limit. Honor Retry-After."
        "500":
          description: "Something broke on the server side."
          content:
            application/json:
              example:
                error:
                  type: "internal_error"
                  message: "Something broke on the server side."
