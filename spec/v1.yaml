        posted_at:
          type: "string"
        replies_count:
          type: "integer"
        commenter:
          $ref: "#/components/schemas/EngagementActor"
        target_post:
          $ref: "#/components/schemas/ActivityTargetPost"
    ActivityReaction:
      description: "One reaction a profile gave to another member's post, returned by
        profile activity when kind is reactions."
      type: "object"
      properties:
        reaction_type:
          type: "string"
        reacted_at:
          type:
            - "string"
            - "null"
        reactor:
          $ref: "#/components/schemas/EngagementActor"
        target_post:
          $ref: "#/components/schemas/ActivityTargetPost"
    ActivityTargetPost:
      description: "The post a profile commented on, reacted to, or reposted, nested
        under ActivityComment and ActivityReaction."
      type: "object"
      properties:
        url:
          type: "string"
        urn:
          type: "string"
        share_urn:
          type: "string"
        text_snippet:
          type: "string"
        author:
          type: "object"
          properties:
            name:
              type: "string"
            url:
              type: "string"
            headline:
              type: "string"
    PostEngagementResult:
      description: "The data object returned by the post engagement endpoints: who
        commented on, reacted to, or reposted one post. Inbound engagement only
        - a profile's own comments, reactions, and reposts come from profile
        activity."
      type: "object"
      properties:
        comments:
          type: "array"
          items:
            $ref: "#/components/schemas/PostComment"
        reactions:
          type: "array"
          items:
            $ref: "#/components/schemas/PostReaction"
        reposts:
          type: "array"
          items:
            $ref: "#/components/schemas/PostRepost"
        pagination:
          $ref: "#/components/schemas/Pagination"
        pagination_token:
          type:
            - "string"
            - "null"
        urn:
          type: "string"
        share_urn:
          type: "string"
    EngagementActor:
      description: "The member behind one comment, reaction, or repost on a post."
      type: "object"
      properties:
        url:
          type: "string"
        full_name:
          type: "string"
        headline:
          type: "string"
        urn:
          type: "string"
    PostComment:
      description: "One comment left on a post, returned by posts/engagement/comments."
      type: "object"
      properties:
        text:
          type: "string"
        posted_at:
          type: "string"
        commenter:
          $ref: "#/components/schemas/EngagementActor"
        replies_count:
          type: "integer"
    PostReaction:
      description: "One reaction given to a post, returned by posts/engagement/reactions."
      type: "object"
      properties:
        reaction_type:
          type: "string"
        reacted_at:
          type:
            - "string"
            - "null"
        reactor:
          $ref: "#/components/schemas/EngagementActor"
    PostRepost:
      description: "One repost of a post, returned by posts/engagement/reposts."
      type: "object"
      properties:
        reposted_at:
          type: "string"
        reposter:
          $ref: "#/components/schemas/EngagementActor"
        url:
          type: "string"
        text:
          type: "string"
    Pagination:
      description: "Pagination metadata on Sales Navigator search results, profile
        activity pages, and post engagement pages."
      type: "object"
      properties:
        returned:
          type: "integer"
        max_results:
          type: "integer"
        pages_scraped:
          type: "integer"
        page:
          type: "integer"
        per_page:
          type: "integer"
        has_more:
          type: "boolean"
        total_estimate:
          type:
            - "integer"
            - "null"
    BatchJob:
      description: "A batch job just after submission: accepted, not yet resolved.
        Also the shape of the job field in the batch.completed webhook payload."
      type: "object"
      properties:
        job_id:
          type: "string"
        status:
          type: "string"
        total:
          type: "integer"
        estimated_completion:
          type: "string"
    BatchJobResult:
      description: "A batch job with its accumulated results, as returned by polling
        GET /batch/{job_id}."
      type: "object"
      properties:
        job_id:
          type: "string"
        status:
          type: "string"
        total:
          type: "integer"
        estimated_completion:
          type: "string"
        succeeded:
          type: "integer"
        failed:
          type: "integer"
        pending:
          type: "integer"
        results_available:
          type: "integer"
        results:
          type: "array"
          items:
            type: "object"
            properties:
              item_index:
                type: "integer"
              status:
                type: "string"
              operation:
                type: "string"
              type:
                type: "string"
              url:
                type: "string"
              data:
                type: "object"
        failures:
          type: "array"
          items:
            type: "object"
            properties:
              item_index:
                type: "integer"
              operation:
                type: "string"
              type:
                type: "string"
              url:
                type: "string"
              status:
                type: "string"
    BatchResultPage:
      description: "A cursor page of immutable, first-seen batch result entries, as
        returned by GET /batch/{job_id}/results."
      type: "object"
      properties:
        job_id:
          type: "string"
        status:
          type: "string"
        results_available:
          type: "integer"
        entries:
          type: "array"
          items:
            type: "object"
            properties:
              delivery_seq:
                type: "integer"
              item_index:
                type: "integer"
              entry_key:
                type: "string"
              data:
                type: "object"
              final_rank:
                type: "integer"
        next_cursor:
          type:
            - "string"
            - "null"
        has_more:
          type: "boolean"
        recommended_poll_ms:
          type: "integer"
    Error:
      description: "The error envelope returned by every /v1 endpoint on failure."
      type: "object"
      properties:
        error:
          type: "object"
          properties:
            type:
              type: "string"
            message:
              type: "string"
            requestId:
              type: "string"
    Account:
      description: "Account state returned by GET /account."
      type: "object"
      properties:
        account_id:
          type: "string"
        tier:
          type:
            - "string"
            - "null"
        credits_remaining:
          type: "integer"
        credits_used_this_month:
          type: "integer"
        price_per_1k_credits_usd:
          type:
            - "number"
            - "null"
        rate_limit:
          type: "object"
          properties:
            requests_per_minute:
              type: "integer"
            concurrent_batch_jobs:
              type: "integer"
            searches_per_hour:
              type: "integer"
            searches_remaining_this_hour:
              type: "integer"
        signals:
          type: "object"
          properties:
            active:
              type: "integer"
            paused:
              type: "integer"
            max_active:
              type: "integer"
            estimated_monthly_credits:
              type: "integer"
        monitoring:
          type: "object"
          properties:
            default_webhook_url:
              type:
                - "string"
                - "null"
            monthly_check_budget:
              type: "integer"
            checks_spent_this_month:
              type: "integer"
    Meta:
      description: "The billing metadata object on every successful /v1 response."
      type: "object"
      properties:
        creditsUsed:
          type: "integer"
        creditsRemaining:
          type: "integer"
        billed:
          type: "boolean"
        reason:
          type: "string"
        requestId:
          type: "string"
        latencyMs:
          type: "integer"
        nextCursor:
          type:
            - "string"
            - "null"
webhooks:
  batch.completed:
    post:
      operationId: "batchCompletedWebhook"
      summary: "Batch job completed"
      description: "Delivered to webhook_url when a batch job finishes processing all
        of its items."
      parameters:
        - name: "X-Up2Data-Event"
          in: "header"
          required: true
          schema:
            type: "string"
          example: "batch.completed"
        - name: "X-Up2Data-Signature"
          in: "header"
          required: true
          schema:
            type: "string"
          description: "HMAC-SHA256 of `{timestamp}.{raw_body}`, formatted as
            `t=<unix_timestamp>,v1=<hex_digest>`."
          example: "t=1767225600,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0\
            ce8e108d8bd"
      requestBody:
        content:
          application/json:
            example:
              event: "batch.completed"
              job:
                job_id: "job_7hd92kfa"
                status: "completed"
                total: 1000
                estimated_completion: "2026-07-07T14:03:00Z"
      responses:
        "200":
          description: "Webhook received"
