<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Up2Data API reference</title>
<style>
:root {
  --ground: #141820;
  --panel: #1a212b;
  --raised: #212a36;
  --line: #2e3847;
  --text: #d6dce4;
  --muted: #7e8a9a;
  --brass: #c8964a;
  --teal: #4fb0a5;
  --alarm: #d4674f;
  --sans: 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font: 400 14px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
}

.shell { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100vh; }

/* ---- rail ---- */

.rail { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }

.rail-top { position: sticky; top: 0; padding: 18px 16px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }

.brand { font-weight: 600; letter-spacing: -0.01em; margin-bottom: 12px; }
.brand span { color: var(--muted); font-weight: 400; }

.search {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: var(--ground);
  color: var(--text);
  font: 400 13px var(--sans);
}
.search:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }

.nav { padding: 10px 0 60px; overflow-y: auto; flex: 1; }

.nav-group { padding: 16px 16px 6px; color: var(--muted); font-size: 11.5px; }

.nav-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; padding: 6px 16px;
  border: 0; border-left: 2px solid transparent; background: none;
  color: var(--text); font: 400 13px/1.45 var(--mono);
  text-align: left; cursor: pointer;
}
.nav-item:hover { background: var(--raised); }
.nav-item.on { border-left-color: var(--brass); background: var(--raised); color: #fff; }
.nav-item:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }
.nav-item.prose { font-family: var(--sans); }

.verb { font-size: 10.5px; color: var(--muted); }
.verb.get { color: var(--teal); }

.nav-empty { padding: 20px 16px; color: var(--muted); font-size: 13px; }

/* ---- content ---- */

.main { padding: 40px 44px 100px; max-width: 900px; }
.main:focus { outline: none; }

h1 { margin: 0 0 10px; font-size: 26px; font-weight: 500; letter-spacing: -0.015em; }
h1.mono { font-family: var(--mono); font-size: 23px; }
h2 { margin: 40px 0 12px; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }

p { margin: 0 0 14px; max-width: 72ch; }
.lede { color: var(--text); font-size: 15.5px; max-width: 68ch; }

.meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 22px; }

.pill {
  padding: 3px 9px; border: 1px solid var(--line); border-radius: 3px;
  font: 400 11.5px var(--mono); color: var(--muted);
}
.pill.path { color: var(--text); }
.pill.auth { color: var(--brass); border-color: rgba(200,150,74,.45); }
.pill.open { color: var(--teal); border-color: rgba(79,176,165,.45); }

.cost {
  margin: 0 0 24px; padding: 12px 14px;
  border-left: 2px solid var(--brass);
  background: rgba(200,150,74,.07);
  font-size: 13.5px; max-width: 72ch;
}
.cost b { color: var(--brass); font-weight: 500; }

.note {
  margin: 0 0 10px; padding: 10px 14px;
  border-left: 2px solid var(--line);
  font-size: 13px; color: var(--text); max-width: 72ch;
}
.note.warn { border-left-color: var(--alarm); background: rgba(212,103,79,.06); }
.note.info { border-left-color: var(--teal); background: rgba(79,176,165,.05); }

/* ---- field table ---- */

.fields { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
.fields th {
  text-align: left; padding: 8px 12px 8px 0;
  border-bottom: 1px solid var(--line);
  color: var(--muted); font: 400 11.5px var(--sans);
}
.fields td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
.fields td.name { font-family: var(--mono); color: #fff; white-space: nowrap; }
.fields td.type { font-family: var(--mono); color: var(--muted); white-space: nowrap; }
.fields td.hint { color: var(--muted); line-height: 1.55; }
.req { color: var(--brass); font-size: 11px; }
.opt { color: var(--muted); font-size: 11px; }

/* ---- code ---- */

pre {
  margin: 0 0 18px; padding: 14px;
  border: 1px solid var(--line); border-radius: 3px;
  background: var(--panel);
  font: 400 12px/1.6 var(--mono);
  white-space: pre-wrap; word-break: break-word;
  overflow-x: auto;
}
.code-label { color: var(--muted); font-size: 11.5px; margin-bottom: 6px; }

/* ---- schema tree ---- */

.tree { font: 400 12.5px/1.75 var(--mono); }
.tree ul { list-style: none; margin: 0; padding-left: 18px; border-left: 1px solid var(--line); }
.tree > ul { padding-left: 0; border-left: 0; }
.tree li { padding: 1px 0; }

.twig { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.fname { color: #fff; }
.ftype { color: var(--muted); font-size: 12px; }
.fnote { color: var(--muted); font-size: 12px; font-family: var(--sans); }

details > summary {
  cursor: pointer; list-style: none;
  display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
}
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: '▸'; color: var(--brass); font-size: 10px; }
details[open] > summary::before { content: '▾'; }
details > summary:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.tree-actions { display: flex; gap: 8px; margin-bottom: 14px; }

.btn {
  padding: 6px 12px; border: 1px solid var(--line); border-radius: 3px;
  background: none; color: var(--muted); font: 400 12.5px var(--sans); cursor: pointer;
}
.btn:hover { color: var(--text); border-color: var(--muted); }
.btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.btn.primary { border-color: var(--brass); color: var(--brass); }

.hits { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
mark { background: rgba(200,150,74,.28); color: #fff; border-radius: 2px; }

.console-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 26px 0 0; }
.console-row input {
  width: 230px; padding: 6px 9px;
  border: 1px solid var(--line); border-radius: 3px;
  background: var(--ground); color: var(--text); font: 400 12px var(--mono);
}
.console-row .why { color: var(--muted); font-size: 12px; }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 44vh; }
  .main { padding: 24px 18px 60px; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>
</head>
<body>
<div class="shell">
  <nav class="rail">
    <div class="rail-top">
      <div class="brand">Up2Data <span>reference</span></div>
      <input id="q" class="search" type="search" placeholder="Search  /" autocomplete="off" spellcheck="false">
    </div>
    <div id="nav" class="nav"></div>
  </nav>
  <main id="main" class="main" tabindex="-1"></main>
</div>

eue, not against the results delivered, and the unused part is refunded when the queue finishes. A link with no limit reserves the maximum for its type — 2,500 for a people search, 1,000 for a company search."},{"warn":"Live endpoints charge on a 404 as well as a 200. A 400, 403, 429 or 503 charges nothing."}]},{"id":"webhooks","name":"Webhooks","body":[{"p":"Configure them in the dashboard under Settings → Integrations. A webhook needs an HTTPS URL, and can carry custom headers for authenticating the callbacks it sends you, plus tags for routing."},{"p":"Your endpoint must answer 2xx within 3 seconds. A failure is retried after 10 minutes, 1 hour, 8 hours and 24 hours, then abandoned — items whose delivery failed can be read back from /open-refresh/list with failed=true."},{"p":"Tags decide where a request’s callbacks go. Name them in webhookTags and every webhook carrying any of those tags receives the results, which is how development, staging and production endpoints stay apart. A tag matching no webhook is rejected with a 400 and nothing is enqueued, so a typo can never leave you waiting for callbacks that were never coming."},{"p":"Tags are lowercased and trimmed before matching, may hold letters, digits, dot, underscore and hyphen, and are capped at 32 characters. A request may name at most 10. They are resolved each time a callback is sent, so a webhook tagged later still receives results from a queue already running."},{"p":"Every enqueue response echoes the webhooks your tags resolved to — the fastest way to confirm routing is wired correctly."}]}],"endpoints":[{"id":"authenticate","label":"authenticate","group":"Auth","method":"POST","path":"/api-auth/authenticate","auth":false,"summary":"Exchange an API key for a JWT valid for 24 hours.","cost":"Free.","notes":[{"info":"The token is valid for 24 hours. It carries an exp claim of iat + 86400."}],"fields":[{"name":"apiKey","type":"text","required":true,"hint":"From the dashboard: Settings → Integrations → 1","updatedAt":"string — ISO 8601"}},{"id":"post-by-url","name":"Post by URL","blurb":"One document per post, keyed by its URN. No profile field — the author is embedded in post.author, since the post need not belong to a profile you have enriched.","shape":{"_id":"string","urn":"string — urn:li:activity:<id>, urn:li:share:<id> or urn:li:ugcPost:<id>","shareUrn":"string — nullable","postUrl":"string — the canonical url LinkedIn reports","requestedUrl":"string — the url you sent, query string and trailing slash stripped","post":"the same shape as an entry in the Activity posts array","scrapedAt":"string — ISO 8601","createdAt":"string — ISO 8601","updatedAt":"string — ISO 8601"}}]};
(function () {
  var D = window.DOCS
  var $ = function (s) { return document.querySelector(s) }
  var CONSOLE_KEY = 'up2data.docs.consoleBase'

  function el(tag, cls, text) {
    var n = document.createElement(tag)
    if (cls) n.className = cls
    if (text !== undefined) n.textContent = text
    return n
  }

  function consoleBase() {
    try { return localStorage.getItem(CONSOLE_KEY) || 'http://localhost:8787' }
    catch (e) { return 'http://localhost:8787' }
  }

  // ---- index for search -------------------------------------------------

  var ITEMS = []
  D.guides.forEach(function (g) {
    ITEMS.push({
      kind: 'guide', id: g.id, name: g.name, group: 'Guides',
      haystack: (g.name + ' ' + g.body.map(function (b) { return b.p || b.warn || '' }).join(' ')).toLowerCase(),
      data: g,
    })
  })
  D.endpoints.forEach(function (e) {
    ITEMS.push({
      kind: 'endpoint', id: e.id, name: e.label, group: e.group, method: e.method,
      haystack: (e.label + ' ' + e.path + ' ' + e.summary + ' ' + e.fields.map(function (f) { return f.name }).join(' ')).toLowerCase(),
      data: e,
    })
  })
  D.schemas.forEach(function (s) {
    ITEMS.push({
      kind: 'schema', id: s.id, name: s.name, group: 'Response shapes',
      haystack: (s.name + ' ' + s.blurb + ' ' + JSON.stringify(s.shape)).toLowerCase(),
      data: s,
    })
  })

  // ---- nav --------------------------------------------------------------

  function renderNav(filter) {
    var nav = $('#nav')
    nav.textContent = ''
    var q = (filter || '').trim().toLowerCase()
    var shown = q ? ITEMS.filter(function (i) { return i.haystack.indexOf(q) > -1 }) : ITEMS

    if (!shown.length) {
      nav.append(el('p', 'nav-empty', 'Nothing matches “' + filter + '”.'))
      return
    }

    var group = null
    shown.forEach(function (item) {
      if (item.group !== group) {
        group = item.group
        nav.append(el('div', 'nav-group', group))
      }
      var btn = el('button', 'nav-item' + (item.kind === 'endpoint' ? '' : ' prose'))
      btn.dataset.id = item.kind + ':' + item.id
      btn.append(el('span', null, item.name))
      if (item.method) btn.append(el('span', 'verb ' + item.method.toLowerCase(), item.method))
      btn.addEventListener('click', function () { location.hash = '#/' + item.kind + '/' + item.id })
      nav.append(btn)
    })
    markActive()
  }

  function markActive() {
    var current = route()
    ;[].forEach.call(document.querySelectorAll('.nav-item'), function (b) {
      b.classList.toggle('on', b.dataset.id === current.kind + ':' + current.id)
    })
  }

  // ---- schema tree ------------------------------------------------------

  function typeOf(value) {
    if (Array.isArray(value)) return 'array'
    if (value && typeof value === 'object') return 'object'
    return 'leaf'
  }

  function splitNote(text) {
    var parts = String(text).split(' — ')
    return { type: parts[0], note: parts.slice(1).join(' — ') }
  }

  function renderNode(name, value, depth) {
    var li = el('li')
    var kind = typeOf(value)

    if (kind === 'leaf') {
      var bits = splitNote(value)
      var row = el('div', 'twig')
      row.append(el('span', 'fname', name))
      row.append(el('span', 'ftype', bits.type))
      if (bits.note) row.append(el('span', 'fnote', bits.note))
      li.append(row)
      return li
    }

    var isArray = kind === 'array'
    var inner = isArray ? value[0] : value
    var details = el('details')
    if (depth < 1) details.open = true

    var summary = el('summary')
    summary.append(el('span', 'fname', name))
    summary.append(el('span', 'ftype', isArray ? 'array of ' + (typeOf(inner) === 'leaf' ? splitNote(inner).type : 'object') : 'object'))
    details.append(summary)

    if (typeOf(inner) === 'leaf') {
      var note = splitNote(inner).note
      if (note) {
        var ul0 = el('ul')
        var only = el('li')
        only.append(el('span', 'fnote', note))
        ul0.append(only)
        details.append(ul0)
      }
    } else {
      var ul = el('ul')
      Object.keys(inner).forEach(function (key) { ul.append(renderNode(key, inner[key], depth + 1)) })
      details.append(ul)
    }

    li.append(details)
    return li
  }

  function renderSchema(schema) {
    var main = $('#main')
    main.append(el('h1', null, schema.name))
    main.append(el('p', 'lede', schema.blurb))

    var actions = el('div', 'tree-actions')
    var expand = el('button', 'btn', 'Expand all')
    var collapse = el('button', 'btn', 'Collapse all')
    actions.append(expand, collapse)
    main.append(actions)

    var tree = el('div', 'tree')
    var ul = el('ul')
    Object.keys(schema.shape).forEach(function (key) { ul.append(renderNode(key, schema.shape[key], 0)) })
    tree.append(ul)
    main.append(tree)

    expand.addEventListener('click', function () {
      [].forEach.call(tree.querySelectorAll('details'), function (d) { d.open = true })
    })
    collapse.addEventListener('click', function () {
      [].forEach.call(tree.querySelectorAll('details'), function (d) { d.open = false })
    })
  }

  // ---- endpoint ---------------------------------------------------------

  function curlFor(e) {
    var base = 'https://api.staging.uptodata.io/api'
    var lines = ['curl -X ' + e.method + " '" + base + e.path + "'"]
    if (e.method !== 'GET') lines.push("  -H 'Content-Type: application/json'")
    if (e.auth) lines.push("  -H 'Authorization: YOUR_ACCESS_TOKEN'")
    if (e.method !== 'GET') {
      var body = {}
      e.fields.forEach(function (f) {
        if (!f.required) return
        body[f.name] = f.type === 'lines' || f.type === 'tags' ? ['…'] :
          f.type === 'links' ? [{ url: '…', limit: 100 }] :
          f.type === 'number' ? 2 : '…'
      })
      lines.push("  -d '" + JSON.stringify(body, null, 2) + "'")
    }
    return lines.join(' \\\n')
  }

  function renderEndpoint(e) {
    var main = $('#main')
    main.append(el('h1', 'mono', e.label))

    var meta = el('div', 'meta')
    meta.append(el('span', 'pill path', e.method + ' ' + e.path))
    meta.append(el('span', 'pill ' + (e.auth ? 'auth' : 'open'), e.auth ? 'token required' : 'public'))
    main.append(meta)

    main.append(el('p', 'lede', e.summary))

    var cost = el('div', 'cost')
    cost.append(el('b', null, 'Cost. '))
    cost.append(document.createTextNode(e.cost))
    main.append(cost)

    if (e.fields.length) {
      main.append(el('h2', null, e.method === 'GET' ? 'Query parameters' : 'Request body'))
      var table = el('table', 'fields')
      var head = el('tr')
      ;['Field', 'Type', '', 'Notes'].forEach(function (h) { head.append(el('th', null, h)) })
      table.append(head)

      e.fields.forEach(function (f) {
        var tr = el('tr')
        tr.append(el('td', 'name', f.name))
        tr.append(el('td', 'type', f.choices ? f.choices.join(' · ') : f.type))
        var flag = el('td')
        flag.append(el('span', f.required ? 'req' : 'opt', f.required ? 'required' : 'optional'))
        tr.append(flag)
        tr.append(el('td', 'hint', f.hint))
        table.append(tr)
      })
      main.append(table)
    }

    if (e.notes.length) {
      main.append(el('h2', null, 'Worth knowing'))
      e.notes.forEach(function (n) {
        main.append(el('div', 'note ' + (n.warn ? 'warn' : 'info'), n.warn || n.info))
      })
    }

    main.append(el('h2', null, 'Example'))
    main.append(el('div', 'code-label', 'Required fields only'))
    main.append(el('pre', null, curlFor(e)))

    var row = el('div', 'console-row')
    var open = el('button', 'btn primary', 'Open in console')
    var input = el('input')
    input.type = 'text'
    input.value = consoleBase()
    input.title = 'Where the console is running'
    input.addEventListener('change', function () {
      try { localStorage.setItem(CONSOLE_KEY, input.value.replace(/\/+$/, '')) } catch (err) {}
    })
    open.addEventListener('click', function () {
      window.open(consoleBase() + '/?endpoint=' + encodeURIComponent(e.id), '_blank')
    })
    row.append(open, input, el('span', 'why', 'opens this endpoint with its form ready'))
    main.append(row)
  }

  // ---- guide ------------------------------------------------------------

  function renderGuide(g) {
    var main = $('#main')
    main.append(el('h1', null, g.name))
    g.body.forEach(function (b) {
      if (b.p) main.append(el('p', b === g.body[0] ? 'lede' : null, b.p))
      else if (b.warn) main.append(el('div', 'note warn', b.warn))
      else if (b.code) {
        main.append(el('div', 'code-label', b.code.label))
        main.append(el('pre', null, b.code.text))
      }
    })
  }

  // ---- routing ----------------------------------------------------------

  function route() {
    var m = (location.hash || '').match(/^#\/(guide|endpoint|schema)\/([\w\-]+)$/)
    if (m) return { kind: m[1], id: m[2] }
    return { kind: 'guide', id: D.guides[0].id }
  }

  function render() {
    var r = route()
    var main = $('#main')
    main.textContent = ''

    var item = ITEMS.filter(function (i) { return i.kind === r.kind && i.id === r.id })[0]
    if (!item) {
      main.append(el('h1', null, 'Not found'))
      main.append(el('p', null, 'Nothing here answers to that address.'))
      return
    }

    if (item.kind === 'guide') renderGuide(item.data)
    else if (item.kind === 'endpoint') renderEndpoint(item.data)
    else renderSchema(item.data)

    main.scrollIntoView({ block: 'start' })
    markActive()
    document.title = item.name + ' — Up2Data reference'
  }

  window.addEventListener('hashchange', render)

  $('#q').addEventListener('input', function (ev) { renderNav(ev.target.value) })

  document.addEventListener('keydown', function (ev) {
    if (ev.key === '/' && document.activeElement !== $('#q')) {
      ev.preventDefault()
      $('#q').focus()
      $('#q').select()
    }
    if (ev.key === 'Escape' && document.activeElement === $('#q')) {
      $('#q').value = ''
      renderNav('')
      $('#q').blur()
    }
  })

  renderNav('')
  render()
})()

</script>
